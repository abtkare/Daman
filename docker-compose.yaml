# منصة «ضمان» — للتشغيل من Hostinger Docker Manager ← Compose from URL
# حاوية واحدة على منفذها الخاص 8096، لا تمسّ nginx ولا أي موقع أو حاوية أخرى على الخادم.
# عند كل تشغيل أو «Redeploy» تنزّل آخر ملف daman-platform-zz-sessionNN.zip من المستودع abtkare/Daman وتشغّله.
# البيانات ومفتاح توقيع الرموز محفوظة في المجلد الدائم daman-data فلا تضيع عند التحديث.
name: daman

services:
  daman:
    image: node:22-alpine
    container_name: daman-platform
    restart: unless-stopped
    # حدود الموارد: لا تأخذ من المشاريع الأخرى على الخادم
    mem_limit: 256m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8096:3000"
    environment:
      PORT: "3000"
      DATA_FILE: /data/db.json
      GH_REPO: abtkare/Daman
    volumes:
      - daman-data:/data
    command:
      - sh
      - -c
      - |
        set -e
        cd /tmp
        cat > boot.mjs <<'EOF'
        import fs from 'fs';
        const repo = process.env.GH_REPO;
        const api = process.env.GH_API || 'https://api.github.com';
        const raw = process.env.GH_RAW || 'https://raw.githubusercontent.com';
        try {
          const list = await (await fetch(`$${api}/repos/$${repo}/contents/`, { headers: { 'User-Agent': 'daman-boot' } })).json();
          const names = list.map(f => f.name).filter(n => /^daman-platform-zz-session\d+\.zip$$/.test(n)).sort();
          if (!names.length) throw new Error('لا يوجد ملف zip في المستودع');
          const z = names.at(-1);
          console.log('== تنزيل ' + z);
          const r = await fetch(`$${raw}/$${repo}/main/$${z}`);
          if (!r.ok) throw new Error('تعذّر التنزيل: ' + r.status);
          fs.writeFileSync('/tmp/app.zip', Buffer.from(await r.arrayBuffer()));
        } catch (e) {
          console.error('✗ ' + e.message);
          if (!fs.existsSync('/data/app.zip')) process.exit(1);
          console.log('== التشغيل بآخر نسخة محفوظة');
          fs.copyFileSync('/data/app.zip', '/tmp/app.zip');
        }
        EOF
        node boot.mjs
        cp /tmp/app.zip /data/app.zip
        rm -rf /tmp/app && mkdir -p /tmp/app && unzip -q -o /tmp/app.zip -d /tmp/app
        echo "== ضمان يعمل على المنفذ 8096"
        exec node /tmp/app/daman-platform/server.js
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

volumes:
  daman-data:
